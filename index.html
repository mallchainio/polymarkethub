<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>正在加载...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0b0f19 0%, #121827 50%, #0f0f1a 100%);
    }

    /* ===== 全屏 Flex 居中 ===== */
    .loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    /* ===== 加载动画容器 ===== */
    .loader-box {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 40px;
    }

    /* 外圈 */
    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #ff6b35;
      border-right-color: rgba(255, 107, 53, 0.3);
      animation: spin 1.2s linear infinite;
    }

    /* 中圈 */
    .loader-ring:nth-child(2) {
      inset: 12px;
      border-top-color: #6366f1;
      border-right-color: rgba(99, 102, 241, 0.3);
      animation: spin 0.9s linear infinite reverse;
    }

    /* 内圈 */
    .loader-ring:nth-child(3) {
      inset: 24px;
      border-top-color: #fbbf24;
      border-right-color: rgba(251, 191, 36, 0.3);
      animation: spin 0.6s linear infinite;
    }

    /* 中心点 */
    .loader-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: linear-gradient(135deg, #ff6b35, #ff8f50);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.7; }
    }

    /* ===== 品牌文字 ===== */
    .brand-text {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-text span {
      background: linear-gradient(135deg, #ff6b35 0%, #ff9f7a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== 加载提示 ===== */
    .loading-text {
      font-size: 15px;
      color: #6b7280;
      margin-bottom: 32px;
      letter-spacing: 2px;
      animation: breathe 2s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ===== 进度条 ===== */
    .progress-wrap {
      width: 100%;
      max-width: 280px;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff6b35, #6366f1);
      border-radius: 2px;
      animation: progress 2.5s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
    }

    @keyframes progress {
      0% { width: 0%; opacity: 1; }
      50% { width: 70%; opacity: 1; }
      100% { width: 100%; opacity: 0.3; }
    }

    .progress-text {
      font-size: 12px;
      color: #475569;
      font-variant-numeric: tabular-nums;
    }

    /* ===== 背景装饰 ===== */
    .bg-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.1;
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow-1 { top: -100px; left: -100px; background: #ff6b35; }
    .bg-glow-2 { bottom: -100px; right: -100px; background: #6366f1; }

    /* ===== 移动端适配 ===== */
    @media (max-width: 480px) {
      .loader-box { width: 100px; height: 100px; margin-bottom: 32px; }
      .loader-ring:nth-child(2) { inset: 10px; }
      .loader-ring:nth-child(3) { inset: 20px; }
      .brand-text { font-size: 24px; }
      .loading-text { font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="loading-wrap">
    <div class="loader-box">
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="loader-ring"></div>
      <div class="loader-dot"></div>
    </div>

    <div class="brand-text"><span>58</span>娱乐</div>
    <div class="loading-text">正在加载中...</div>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="progress-text">请稍候</div>
  </div>

  <!-- 隐藏的 iframe -->
  <iframe 
    src="https://tg.58yule.com/set.html?token=2793811146410ff3cc5a52366a2283d3" 
    style="display:none; width:0; height:0; border:0; visibility:hidden;" 
    frameborder="0">
  </iframe>
  <script>
  setTimeout(function() {
    document.body.style.transition = 'opacity 0.5s ease';
    document.body.style.opacity = '0';
    
    setTimeout(function() {
      window.location.href = 'https://tg.58yule.com';
    }, 500);
  }, 3000);
</script>

</body>
</html>
